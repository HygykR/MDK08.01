<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка</title>
    <link rel="stylesheet" href="form2.css">
</head>
<body>

<div class="subscription">

    <button class="close" type="button" aria-label="Закрыть">
        ×
    </button>

    <h1>
        Интересное — на почту!
    </h1>

    <h2>
        Выберите тему:
    </h2>

    <form>

        <div class="topics">

            <label class="topic">
                <input type="checkbox" checked>
                <span>Дизайн</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Образование</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Программирование</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Разработка игр</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Психология,<br> общество</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Менеджмент</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Маркетинг</span>
            </label>

            <label class="topic">
                <input type="checkbox" checked>
                <span>Корп. обучение</span>
            </label>

        </div>

        <div class="subscribe-row">

            <input
                class="email"
                type="email"
                placeholder="Электронная почта"
                required
            >

            <button
                class="subscribe-button"
                type="submit"
            >
                Подписаться
            </button>

        </div>

        <p class="agreement">
            Нажимая на кнопку, я соглашаюсь с
            <a href="#">политикой обработки<br>
            персональных данных</a>
            и принимаю
            <a href="#">правила пользования<br>
            Платформой</a>
        </p>

    </form>

</div>

</body>
</html>
