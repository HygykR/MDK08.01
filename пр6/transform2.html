<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа</title>

    <link rel="stylesheet" href="css/style2.css">
</head>

<body>

    <h1>Практическая работа: Transform и Transition</h1>


    <h2>1. Стрелки для слайдера</h2>

    <div class="slider">

        <button class="arrow">‹</button>

        <div class="slide">
            Слайд
        </div>

        <button class="arrow">›</button>

    </div>


    <h2>2. Два поляроида</h2>

    <div class="polaroids">

        <div class="polaroid left">
            <img class="photo" src="img/1.jpg" alt="Поляроид 1">
            <p>Поляроид 1</p>
        </div>

        <div class="polaroid right">
            <img class="photo" src="img/2.jpg" alt="Поляроид 2">
            <p>Поляроид 2</p>
        </div>

    </div>

    <h2>4. Кнопка</h2>

    <button class="my-button">
        Наведи на меня
    </button>


    <h2>5. Блок с элементом по центру</h2>

    <div class="image-block">

        <img class="square" src="img/3.png" alt="Изображение">

    </div>


    <h2>6. Три слоя</h2>

    <div class="layers">

        <div class="layer-text">
            Наведите на блок
        </div>

    </div>

</body>

</html>
