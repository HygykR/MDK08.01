<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-3 py-5">

  <div class="container text-center fw-bold fs-md">
    
    <h3 class="text-start mb-5 fg-body">Шапка</h3>
    <div class="row g-2 mb-12">
      <div class="col-12 sm:col-6 md:col-6 xl:col theme-danger theme-contrast py-4 rounded-5">1</div>
      <div class="col-12 sm:col-6 md:col-3 xl:col theme-warning theme-muted py-4 rounded-5">2</div>
      <div class="col-12 sm:col-6 md:col-3 xl:col theme-warning theme-contrast py-4 rounded-5">3</div>
      <div class="col-12 sm:col-6 md:col-6 xl:col theme-success theme-contrast py-4 rounded-5">4</div>
      <div class="col-12 sm:col-12 md:col-6 xl:col theme-info theme-contrast py-4 rounded-5">5</div>
    </div>

    <h3 class="text-start mb-5 fg-body">Main</h3>
    <div class="row g-2 mb-12">
      <div class="col-12 md:col-9 theme-danger theme-contrast py-5 rounded-5">1</div>
      <div class="col-12 md:col-3 theme-warning theme-muted py-5 rounded-5">2</div>
    </div>

    <h3 class="text-start mb-5 fg-body">Футер</h3>
    <div class="row g-2">
      <div class="col-12 sm:col-6 md:col-4 xl:col-3 theme-danger theme-contrast py-4 rounded-5">1</div>
      <div class="col-12 sm:col-6 md:col-4 xl:col-3 theme-warning theme-muted py-4 rounded-5">2</div>
      <div class="col-12 d-none sm:d-none xl:d-block xl:col-3 theme-warning theme-contrast py-4 rounded-5">3</div>
      <div class="col-12 sm:col-12 md:col-4 xl:col-3 theme-success theme-contrast py-4 rounded-5">4</div>
    </div>

  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
