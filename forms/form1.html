<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="form1.css">
</head>
<body>

<div class="form-wrapper">

    <h1>Напишите нам</h1>

    <p class="subtitle">Мы будем очень рады вашему письму!</p>

    <form class="contact-form">

        <label for="name">
            <span class="required">*</span>
            Имя
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Напишите ваше имя"
            required
        >

        <label for="email">
            <span class="required">*</span>
            Электронная почта
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Напишите ваш электронный адрес"
            required
        >

        <label for="message">
            Текст сообщения
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="Введите текст сообщения"
        ></textarea>

        <button type="submit">ОТПРАВИТЬ</button>

    </form>

    <p class="hint">
        Поля, отмеченные <span>*</span> обязательны для заполнения.
    </p>

</div>

</body>
</html>
