<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>NailArt — главная</title>
</head>
<body>

    //= template/header.html

    <main class="container my-5">

        <div class="p-5 mb-5 bg-light rounded-3 text-center">
            <h1 class="display-5 fw-bold">Всё для идеального маникюра</h1>
            <p class="lead">Гель-лаки, инструменты и LED-лампы для мастеров и любителей.</p>
            <a href="catalog.html" class="btn btn-primary btn-lg">Открыть каталог</a>
            <a href="about.html" class="btn btn-outline-dark btn-lg">О магазине</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h2 class="text-center mb-4">Регистрация</h2>

                <form class="border rounded p-4 bg-light">
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name" placeholder="Иван Иванов">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="mail@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" placeholder="Введите пароль">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>
            </div>
        </div>

    </main>

    //= template/footer.html

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
